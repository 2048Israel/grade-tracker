name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import gradetracker, sys
          tag = "${{ github.ref_name }}"
          if tag != "v" + gradetracker.__version__:
              sys.exit(f"Tag {tag} doesn't match __version__ {gradetracker.__version__}: the app would keep offering itself as an update.")

      - name: Install PyInstaller
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Test, then build GradeTracker.exe
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GradeTracker
          path: dist/GradeTracker.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/GradeTracker.exe
          --title "Grade Tracker ${{ github.ref_name }}"
          --notes-file packaging/release-notes.md
